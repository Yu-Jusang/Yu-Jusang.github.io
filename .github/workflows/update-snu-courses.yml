name: Update SNU course data

on:
  schedule:
    - cron: '17 9,21 * * *'
  workflow_dispatch:
    inputs:
      reuse_saved_data:
        description: 'Deploy saved course data without crawling again'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install requests==2.32.5 beautifulsoup4==4.15.0
      - name: Fetch public course list
        if: ${{ !inputs.reuse_saved_data }}
        run: python professors-demo/crawl_snu.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

